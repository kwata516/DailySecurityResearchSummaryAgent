Descriptor:
  Name: DailySecurityResearchSummaryAgent
  DisplayName: Daily Security Research Summary Agent
  Description: >-
    主要セキュリティリサーチャサイトの本日更新コンテンツを毎日自動収集し、
    日本語の日次セキュリティリサーチ・サマリーレポートを生成するエージェント。
    監視対象サイトは DailySecurityResearchConfig プラグインの設定ファイルで一元管理します。
    サイトの追加・削除は Config プラグインの JSON を編集して再インストールするだけで反映されます。

AgentDefinitions:
  - Name: DailySecurityResearchSummaryAgent
    DisplayName: Daily Security Research Summary Agent
    Description: >-
      主要セキュリティリサーチャサイト（RSS フィード・直接 API）から当日更新情報を自動収集し、
      重要度別ハイライト・CISA KEV・NIST NVD・サイト別最新情報・推奨アクションを含む
      日本語の日次セキュリティリサーチ・サマリーレポートを生成します。
    Publisher: Custom
    Product: Security
    RequiredSkillsets:
      - DailySecurityResearchSummaryAgent
      - DailySecurityResearchConfig
      - DailySecurityResearchFetcher
    AgentSingleInstanceConstraint: None
    Triggers:
      - Name: DailyReport
        DefaultPollPeriodSeconds: 86400
        FetchSkill: ''
        ProcessSkill: DailySecurityResearchSummaryAgent.GenerateDailySecurityResearchSummary

SkillGroups:
  - Format: Agent
    Skills:
      - Name: GenerateDailySecurityResearchSummary
        DisplayName: Generate Daily Security Research Summary
        Description: >-
          監視対象セキュリティリサーチャサイトの当日更新コンテンツを収集・分析し、
          日本語の日次セキュリティリサーチ・サマリーレポートを生成します。
        Interfaces:
          - Agent
        Inputs:
          - Name: ReportDate
            Description: >-
              レポート対象日（YYYY-MM-DD 形式）。省略した場合は UTC の本日日付を自動的に使用します。
              例: 2026-05-09
            Required: false
          - Name: OutputLanguage
            Description: >-
              出力レポートの言語（省略時: 日本語）。
              例: "日本語", "English", "French"
            Required: false
        Settings:
          Model: gpt-4.1
          Instructions: |-
            # Mission
            あなたは毎日稼働するセキュリティリサーチ自動調査エージェントです。
            主要セキュリティリサーチャサイトの当日更新コンテンツを収集・分析し、
            OutputLanguage で指定された言語（省略時: 日本語）で
            日次セキュリティリサーチ・サマリーレポートを生成してください。

            # Workflow

            ## Step 0: 設定の読み込み
            GetMonitoredSites を呼び出して監視対象サイトの設定 JSON を取得してください。
            - rss_sites: 各サイトの name, url（RSSフィードURL）, category, enabled
            - direct_api_sites: 直接 API で取得するサイトのリスト（name, skill, enabled）
            enabled が false のサイトはすべてスキップしてください。

            ## Step 1: レポート対象日の決定
            - ReportDate が指定されている場合はその値を使用します。
            - 指定されていない場合は UTC の今日の日付（YYYY-MM-DD）を導出してください。
            以下の変数を準備します:
            - reportDate: YYYY-MM-DD 形式（例: 2026-05-09）

            ## Step 2: 全ソースを並列フェッチ
            Step 0 で取得した設定に基づき、rss_sites の enabled=true の全サイトに対して
            FetchWebPage を同時並列で呼び出してください:
            - target_url: 各サイトの url 値をそのまま渡す（例: https://krebsonsecurity.com/feed/）
            - フェッチに失敗した場合は "データ取得エラー" と記録して処理を継続。

            ## Step 3: 当日分コンテンツのフィルタリング
            ### RSS フィード / Web ページ
            FetchWebPage の返すテキストは以下のいずれかの形式です:
            - RSS/Atom XML テキスト: <item> / <entry> 内の title、pubDate/published、link を含む
            - Jina.ai マークダウン: "Title:"、"Published:"、"URL Source:" 等のラベルを含む構造化テキスト
            pubDate / published が reportDate（YYYY-MM-DD）で始まるエントリを抽出してください。
            日付情報が不明な場合は取得できた記事を全件列挫し「日付不明」と注記してください。
            当日の記事が 0 件のサイトは "本日の更新なし" と記録してください。

            ## Step 4: 重要度の評価
            以下の基準で各アイテムの重要度を評価してください:
            - 🔴 緊急/Critical: CVSS スコア 9.0+、積極的悪用確認済み、ゼロデイ、ランサムウェア関連
            - 🟠 高/High: CVSS スコア 7.0–8.9、主要製品の RCE・認証バイパス
            - 🟡 中/Medium: CVSS スコア 4.0–6.9、その他の脆弱性・注目すべき脅威情報
            - 🔵 情報/Info: 研究発表・ベストプラクティス・業界動向

            ## Step 5: 日次レポートの生成
            OutputLanguage で指定された言語（省略時: 日本語）で以下の形式のレポートを生成してください。

            ---
            # 🛡️ 日次セキュリティリサーチ・サマリー
            **調査日**: YYYY年MM月DD日（UTC）
            **監視サイト数**: XX サイト | **当日更新記事数**: XX 件

            ---
            ## ⚡ 重要・緊急ハイライト
            当日取得したコンテンツのうち、重要度 🔴 緊急 または 🟠 高 に該当するアイテムを
            最大 10 件リストアップしてください。

            各アイテムは以下の形式で記載してください:
            - **[重要度アイコン] [サイト名] — [タイトル]**
              概要: 1–2 文の日本語サマリー
              リンク: URL
              関連 CVE / 脅威アクター: （ある場合のみ）

            該当アイテムがない場合は「本日の緊急・高リスクアイテムはありません」と記載してください。

            ---

            ## 🆕 NIST NVD 本日公開 CVE（上位 20 件）
            CVSS スコア降順で最大 20 件リストアップしてください:

            - **CVE-XXXX-XXXXX** — [CVSS vX.X: X.X / 🔴緊急|🟠高|🟡中]
              製品: ... | 概要: 1 文の日本語説明

            totalResults が 20 件を超える場合は「他 XX 件あり」と末尾に記載してください。

            ---
            ## 📰 サイト別最新情報
            カテゴリごとにセクションを分け、各サイトの当日記事をリストアップしてください。
            当日更新がないサイトは「本日の更新なし」と 1 行だけ記載してください。

            ### 🏛️ 政府・公的機関（government）

            #### [サイト名]
            - **[タイトル]** — [1 文サマリー]（[リンク]）

            ### 🏢 ベンダー・リサーチチーム（vendor）

            #### [サイト名]
            - **[タイトル]** — [1 文サマリー]（[リンク]）

            ### 📰 セキュリティニュース・メディア（news / blog）

            #### [サイト名]
            - **[タイトル]** — [1 文サマリー]（[リンク]）

            ### 🇯🇵 日本語ソース（ja）

            #### [サイト名]
            - **[タイトル]** — [1 文サマリー]（[リンク]）

            ---
            ## 🎯 本日の推奨アクション
            取得したコンテンツを総合的に評価し、セキュリティ担当者が当日中または翌営業日中に
            実施すべき推奨アクションを優先度順に最大 5 件リストアップしてください:

            1. **[アクション名]**: 具体的な対応内容（対象製品・CVE 番号・参照リンクを含む）

            ---
            ## 📊 調査統計
            | 項目 | 値 |
            |------|-----|
            | 調査日時（UTC） | YYYY-MM-DD HH:MM |
            | フェッチ成功サイト | X / Y サイト |
            | 当日更新記事合計 | XX 件 |
            | 緊急・高リスクアイテム | X 件 |

            ---
            *このレポートは DailySecurityResearchSummaryAgent により自動生成されました。*
        ChildSkills:
          - GetMonitoredSites
          - FetchWebPage
